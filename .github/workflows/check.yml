name: GS Engelli Bilet Takip


on:
  workflow_dispatch:  # Manuel tetikleme için

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Son karşılaşma durumunu cache'den yükle
        uses: actions/cache@v4
        with:
          path: last_matches.json
          key: gs-bilet-state-${{ github.run_id }}
          restore-keys: |
            gs-bilet-state-

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install requests beautifulsoup4

      - name: Formu kontrol et
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_bilet.py

      - name: Güncel durumu cache'e kaydet
        if: always()
        uses: actions/cache@v4
        with:
          path: last_matches.json
          key: gs-bilet-state-${{ github.run_id }}
